<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — date Victor</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="topnav">
  <a class="logo" href="index.html">date&nbsp;Victor</a>
  <nav class="pillnav" id="pillnav"></nav>
</div>

<div class="wrap">
  <div class="page-card" id="pageCard"></div>
  <footer><a href="index.html">← Back to profile</a></footer>
</div>

<script src="../data/victor-data.js"></script>
<script src="assets/app.js"></script>
<script>
  renderNav("contact.html");
  const d = window.VictorDB.data;
  const vis = window.VictorDB.getVisibility();

  document.getElementById("pageCard").innerHTML = `
    <div class="page-title">Get in touch</div>
    <div class="page-sub">${d.contact.note}</div>
    <div class="contact-row"><span class="ico">✉️</span><span>${d.contact.email}</span></div>
    <div class="contact-row"><span class="ico">📱</span><span>${d.contact.phone}</span></div>
    ${vis.schedulingEnabled && d.contact.schedulingLink
      ? `<div class="contact-row"><span class="ico">📅</span><a href="${d.contact.schedulingLink}" target="_blank">Schedule a time →</a></div>`
      : `<div class="schedule-off">📅 Self-serve scheduling is turned off for now — message first so Victor can actually screen who he's meeting, then a time gets figured out together.</div>`
    }
  `;
</script>
</body>
</html>
