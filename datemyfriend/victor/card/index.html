<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>date Victor 🍑</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  #heart-layer{ position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }

  .card{
    width:100%; max-width:380px;
    background:var(--card-bg);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
    animation: card-in .6s cubic-bezier(.2,.9,.3,1.3) both;
    transition: transform .15s ease;
    will-change: transform;
  }
  .card.shake{ animation: shake .45s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px) rotate(-2deg); }
    40%{ transform:translateX(9px) rotate(2deg); }
    60%{ transform:translateX(-6px) rotate(-1deg); }
    80%{ transform:translateX(4px) rotate(1deg); }
  }

  .photo{
    position:relative; height:320px;
    background:linear-gradient(135deg,var(--coral),var(--pink) 55%, var(--orange));
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden;
  }
  .photo::after{ content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.35), transparent 45%); }
  .initials{
    font-family:'Poppins', sans-serif; font-weight:800; font-size:5.6rem;
    color:rgba(255,255,255,.92); text-shadow:0 6px 24px rgba(0,0,0,.15);
    transition: transform .4s ease;
  }
  .photo:hover .initials{ transform:scale(1.06) rotate(-2deg); }
  .verified{
    position:absolute; bottom:14px; right:14px;
    background:rgba(255,255,255,.92); color:var(--coral);
    font-family:'Poppins',sans-serif; font-weight:700; font-size:.7rem;
    padding:5px 10px; border-radius:999px; z-index:2;
  }

  .info{ padding:20px 22px 6px; }
  .name-row{ display:flex; align-items:baseline; gap:8px; font-family:'Poppins', sans-serif; }
  .name-row .name{ font-size:1.4rem; font-weight:700; }
  .name-row .age{ font-size:1.1rem; color:var(--ink-soft); font-weight:500; }
  .meta{ margin-top:6px; font-size:.88rem; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:10px; }
  .bio{ margin:14px 0 4px; font-size:.94rem; line-height:1.5; }

  .home-tags{ padding:16px 22px 20px; display:flex; flex-wrap:wrap; gap:8px; }

  .actions{ display:flex; justify-content:center; gap:20px; margin-top:24px; z-index:2; }
  .action-btn{
    width:56px; height:56px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 12px 24px -8px rgba(43,28,46,.25);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; cursor:pointer;
    transition: transform .15s ease;
  }
  .action-btn:hover{ transform:translateY(-4px) scale(1.05); }
  .action-btn:active{ transform:scale(.9); }
  .action-btn.nope{ color:#b0a4b3; font-size:1.5rem; }
  .action-btn.like{ color:#fff; background:linear-gradient(135deg,var(--coral),var(--pink)); width:66px; height:66px; font-size:1.6rem; }
  .action-btn.star{ color:#ffb648; }
  .action-btn.like.pop{ animation: pop .35s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }

  #burst-layer{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  .burst-heart{ position:absolute; font-size:22px; animation: burst 1s ease-out forwards; }
  @keyframes burst{ 0%{ transform:translate(0,0) scale(.6); opacity:1;} 100%{ transform:translate(var(--dx),var(--dy)) scale(1.3); opacity:0;} }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div id="heart-layer"></div>
<div id="burst-layer"></div>

<div class="topnav">
  <a class="logo" href="index.html">date&nbsp;Victor</a>
  <nav class="pillnav" id="pillnav"></nav>
</div>

<div class="wrap">
  <div class="card" id="card">
    <div class="photo" id="photo" title="Click for a different look">
      <div class="initials" id="initials">VN</div>
      <div class="verified">✓ Vetted by a friend</div>
    </div>
    <div class="info">
      <div class="name-row">
        <span class="name" id="nameOut"></span>
        <span class="age" id="ageOut"></span>
      </div>
      <div class="meta" id="metaOut"></div>
      <p class="bio" id="bioOut"></p>
    </div>
    <div class="home-tags" id="tagsOut"></div>
  </div>

  <div class="actions">
    <button class="action-btn nope" id="nopeBtn" aria-label="Nope">✕</button>
    <button class="action-btn like" id="likeBtn" aria-label="Like">♥</button>
    <button class="action-btn star" id="starBtn" aria-label="Super like">★</button>
  </div>

</div>

<script src="../data/victor-data.js"></script>
<script src="assets/app.js"></script>
<script>
  const d = window.VictorDB.data;
  document.getElementById("nameOut").textContent = d.basics.name;
  document.getElementById("ageOut").textContent = d.basics.age;
  document.getElementById("metaOut").innerHTML =
    `<span>📍 ${d.basics.location}</span><span>💼 ${d.basics.job}</span>`;
  document.getElementById("bioOut").textContent = d.bio;

  if (window.VictorDB.isVisible("interests")) {
    document.getElementById("tagsOut").innerHTML = d.interests
      .map((t) => `<span class="tag">${t}</span>`).join("");
  }

  renderNav("index.html");
  spawnFloatingHearts(document.getElementById("heart-layer"));

  // card tilt
  const card = document.getElementById("card");
  card.addEventListener("mousemove", (e) => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `rotateY(${x*6}deg) rotateX(${-y*6}deg) translateY(-4px)`;
  });
  card.addEventListener("mouseleave", () => { card.style.transform = ""; });

  // photo cycling
  const photo = document.getElementById("photo");
  const initialsEl = document.getElementById("initials");
  const gradients = [
    'linear-gradient(135deg,#ff6f61,#ff4d8d 55%,#ff9a56)',
    'linear-gradient(135deg,#ff9a56,#ffb648 55%,#ff6f61)',
    'linear-gradient(135deg,#ff4d8d,#c86fff 55%,#ff6f61)'
  ];
  let pi = 0;
  photo.addEventListener("click", () => {
    pi = (pi + 1) % gradients.length;
    photo.style.background = gradients[pi];
    initialsEl.style.transform = 'scale(0.85)';
    setTimeout(() => initialsEl.style.transform = '', 200);
  });

  // like burst
  const likeBtn = document.getElementById("likeBtn");
  const burstLayer = document.getElementById("burst-layer");
  likeBtn.addEventListener("click", () => {
    likeBtn.classList.remove("pop"); void likeBtn.offsetWidth; likeBtn.classList.add("pop");
    const rect = likeBtn.getBoundingClientRect();
    for (let i = 0; i < 10; i++) {
      const b = document.createElement("div");
      b.className = "burst-heart"; b.textContent = "❤️";
      const angle = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 90;
      b.style.setProperty("--dx", Math.cos(angle)*dist + "px");
      b.style.setProperty("--dy", Math.sin(angle)*dist - 40 + "px");
      b.style.left = (rect.left + rect.width/2) + "px";
      b.style.top = (rect.top + rect.height/2) + "px";
      burstLayer.appendChild(b);
      setTimeout(() => b.remove(), 1000);
    }
  });

  document.getElementById("nopeBtn").addEventListener("click", () => {
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  });

  document.getElementById("starBtn").addEventListener("click", () => {
    const rect = document.getElementById("starBtn").getBoundingClientRect();
    for (let i = 0; i < 8; i++) {
      const b = document.createElement("div");
      b.className = "burst-heart"; b.textContent = "⭐";
      const angle = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 80;
      b.style.setProperty("--dx", Math.cos(angle)*dist + "px");
      b.style.setProperty("--dy", Math.sin(angle)*dist - 30 + "px");
      b.style.left = (rect.left + rect.width/2) + "px";
      b.style.top = (rect.top + rect.height/2) + "px";
      burstLayer.appendChild(b);
      setTimeout(() => b.remove(), 1000);
    }
  });
</script>
</body>
</html>
