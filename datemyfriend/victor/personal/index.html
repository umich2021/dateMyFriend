<!DOCTYPE html>
<html lang="en" data-theme="desktop">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor Ng</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="progress"></div>

<nav id="nav">
  <a class="brand" href="index.html">VICTOR NG</a>
  <ul class="navlinks" id="navlinks"></ul>
</nav>

<section class="hero">
  <div class="eyebrow"><span id="eyebrowOut"></span></div>
  <h1 class="hero-title">
    <span class="line"><span>Hi, I'm Victor.</span></span>
    <span class="line"><span>Nice to meet you.</span></span>
  </h1>
  <p class="hero-sub" id="bioOut"></p>
  <div class="hero-meta" id="metaOut"></div>
  <div class="scroll-hint"><div class="bar"></div> Scroll</div>
</section>

<section id="about">
  <div class="label">About</div>
  <div class="about-grid">
    <div class="reveal reveal-left"><div class="avatar" id="avatarOut">VN</div></div>
    <div class="about-text reveal">
      <h2>A little bit of everything, taken fairly seriously.</h2>
      <div id="essayOut"></div>
      <div class="stat-row" id="statRow"></div>
      <div id="friendTeaser"></div>
    </div>
  </div>
</section>

<section id="gallery-section"></section>

<section id="interests-section"></section>

<section id="contact" class="contact">
  <div class="reveal">
    <h2>Curious? Let's talk.</h2>
    <a href="contact.html" class="magnetic-btn" id="magnetBtn"><span>Say hello →</span></a>
  </div>
</section>

<footer class="sitefoot">
  © 2026 — built with a little too much enthusiasm
</footer>

<script src="../data/victor-data.js"></script>
<script src="assets/app.js"></script>
<script>
  const d = window.VictorDB.data;
  document.getElementById("eyebrowOut").textContent = `${d.basics.job} · ${d.basics.location}`;
  document.getElementById("bioOut").textContent = d.bio;
  document.getElementById("avatarOut").textContent = d.basics.name.split(" ").map(w => w[0]).join("");
  document.getElementById("essayOut").innerHTML = d.aboutEssay.map(p => `<p>${p}</p>`).join("");

  document.getElementById("metaOut").innerHTML = `
    <div>📍 <strong>${d.basics.location}</strong></div>
    <div>💼 <strong>${d.basics.job}</strong></div>
    <div>🎓 <strong>${d.basics.school}</strong></div>
    <div>${d.basics.age} <strong>years old</strong></div>
  `;

  document.getElementById("statRow").innerHTML = `
    <div class="stat"><div class="num">${d.basics.age}</div><div class="cap">Age</div></div>
    <div class="stat"><div class="num">${d.basics.height}</div><div class="cap">Height</div></div>
    <div class="stat"><div class="num">${d.basics.location.split(",")[1]?.trim() || d.basics.location}</div><div class="cap">Based in</div></div>
    <div class="stat"><div class="num">UM</div><div class="cap">School</div></div>
  `;

  if (window.VictorDB.isVisible("friends") && d.friendReviews.length) {
    const r = d.friendReviews[0];
    document.getElementById("friendTeaser").innerHTML = `
      <div class="friend-teaser reveal">
        <p>"${r.quote}"</p>
        <div class="who">— ${r.name}, ${r.relation}</div>
        <a href="friends.html">Read what other friends say →</a>
      </div>`;
  }

  if (window.VictorDB.isVisible("gallery") && d.gallery.length) {
    const tiles = d.gallery.map(g => `
      <div class="gallery-tile">
        <span class="emoji">${g.emoji}</span>
        <span class="cap">${g.label}</span>
      </div>`).join("");
    document.getElementById("gallery-section").outerHTML = `
      <section id="gallery">
        <div class="label">Photos</div>
        <div class="gallery-grid">${tiles}</div>
      </section>`;
  }

  if (window.VictorDB.isVisible("interests")) {
    const items = d.interests.map(t => `<span>${t}</span>`).join("");
    document.getElementById("interests-section").outerHTML = `
      <section id="interests">
        <div class="label">Interests</div>
        <div class="marquee-wrap"><div class="marquee">${items}${items}</div></div>
      </section>`;
  }

  renderNav("index.html");
  initChrome({ lockedTheme: "desktop" });
  initMagnetic(document.getElementById("magnetBtn"));
</script>
</body>
</html>
