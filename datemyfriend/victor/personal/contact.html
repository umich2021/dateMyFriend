<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Victor Ng</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="progress"></div>

<nav id="nav">
  <a class="brand" href="index.html">VICTOR NG</a>
  <ul class="navlinks" id="navlinks"></ul>
</nav>

<section class="page-hero reveal">
  <h1>Let's talk.</h1>
  <p id="contactSub"></p>
</section>

<section id="contactContent" style="text-align:center;"></section>

<footer class="sitefoot"><a href="index.html">← Back home</a></footer>

<script src="../data/victor-data.js"></script>
<script src="assets/app.js"></script>
<script>
  renderNav("contact.html");
  const d = window.VictorDB.data;
  const vis = window.VictorDB.getVisibility();

  document.getElementById("contactSub").textContent = d.contact.note;

  document.getElementById("contactContent").innerHTML = `
    <div class="contact-rows reveal">
      <div class="contact-row">✉️&nbsp; ${d.contact.email}</div>
      <div class="contact-row">📱&nbsp; ${d.contact.phone}</div>
    </div>
    ${vis.schedulingEnabled && d.contact.schedulingLink
      ? `<div class="contact-rows" style="margin-top:14px;"><div class="contact-row">📅&nbsp; <a href="${d.contact.schedulingLink}" target="_blank" style="color:var(--accent);">Schedule a time →</a></div></div>`
      : `<div class="schedule-off reveal">Self-serve scheduling is turned off for now, on purpose — a direct booking link means anyone could lock in a date before Victor's had a chance to actually screen them, which defeats the point of a friend-vetted site. Message first, and a time gets figured out from there.</div>`
    }
  `;
  initChrome();
</script>
</body>
</html>
