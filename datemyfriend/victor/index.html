<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor Ng: An Exhibition</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="progressLine"></div>
<a class="wordmark" href="#room-entrance">Victor Ng</a>
<div class="room-counter" id="roomCounter"></div>
<nav class="room-nav" id="roomNav"></nav>

<section class="room" id="room-entrance">
  <div class="room-inner">
    <div class="entrance-eyebrow">An Exhibition</div>
    <h1 class="entrance-title" id="entranceTitle"></h1>
    <div class="entrance-meta" id="entranceMeta"></div>
  </div>
  <div class="entrance-cue"><span class="arrow">↓</span> Begin the walkthrough</div>
</section>

<div id="roomsContainer"></div>

<script src="data/victor-data.js"></script>
<script src="assets/app.js"></script>
<script>
  const d = window.VictorDB.data;
  const vis = window.VictorDB;

  document.getElementById("entranceTitle").textContent = d.basics.name;
  document.getElementById("entranceMeta").innerHTML = `
    <div><strong>${d.basics.age}</strong> years old</div>
    <div><strong>${d.basics.location}</strong></div>
    <div><strong>${d.basics.job}</strong></div>
  `;

  const rooms = [{ id: "room-entrance", label: "Entrance" }];

  // ---- Room: About ----
  if (vis.isVisible("about")) {
    rooms.push({
      id: "room-self-portrait",
      label: "About",
      body: `
        <div class="portrait-grid">
          <div>
            <div class="portrait-plate">${d.portrait ? `<img src="${d.portrait}" alt="${d.basics.name}">` : d.basics.name.split(" ").map(w => w[0]).join("")}</div>
          </div>
          <div class="portrait-text">
            ${d.aboutEssay.map(p => `<p>${p}</p>`).join("")}
            <div class="plaque">
              <div>Age<strong>${d.basics.age}</strong></div>
              <div>Job<strong>${d.basics.job}</strong></div>
              <div>Location<strong>${d.basics.location}</strong></div>
              <div>Height<strong>${d.basics.height}</strong></div>
            </div>
          </div>
        </div>
      `,
    });
  }

  // ---- Room: The Collection (photos) ----
  if (vis.isVisible("gallery") && d.gallery.length) {
    rooms.push({
      id: "room-collection",
      label: "The Collection",
      body: `
        <div class="filmstrip-wrap">
          <div class="filmstrip">
            ${d.gallery.map((g, i) => `
              <div class="plate">
                <div class="plate-frame">${g.video ? `<video src="${g.video}" ${g.photo ? `poster="${g.photo}"` : ""} controls playsinline preload="metadata"></video>` : g.photo ? `<img src="${g.photo}" alt="${g.label}">` : g.emoji}</div>
                <div class="plate-caption">
                  <span>${g.label}</span>
                  <em>Plate ${romanize(i + 1)}</em>
                </div>
              </div>`).join("")}
          </div>
          <div class="filmstrip-cue">→ scroll to view the full collection</div>
        </div>
      `,
    });
  }

  // ---- Room: Green Flags & Red Flags ----
  if (vis.isVisible("flags") && d.flags.length) {
    rooms.push({
      id: "room-studies",
      label: "Green Flags & Red Flags",
      body: `
        <div class="study-list">
          ${d.flags.map((f, i) => `
            <div class="study ${f.type}">
              <span class="num">${romanize(i + 1)}</span>
              <div>
                <span class="flag-tag ${f.type}">${f.type === "green" ? "Green flag" : "Red flag"}</span>
                <p>${f.text}</p>
              </div>
            </div>`).join("")}
        </div>
      `,
    });
  }

  // ---- Room: Ideal Type & Values ----
  if (vis.isVisible("idealType") || vis.isVisible("values")) {
    let brief = "";
    if (vis.isVisible("idealType")) {
      brief += `
        <p class="brief-quote">"${d.idealType.summary}"</p>
        <div class="brief-tags">${d.idealType.tags.map(t => `<span>${t}</span>`).join("")}</div>
      `;
    }
    let cols = "";
    if (vis.isVisible("idealType")) {
      cols += `
        <div class="brief-block">
          <h3>What He's Looking For</h3>
          <div class="brief-line"><strong>Interested in</strong>${d.idealType.interestedIn}</div>
          <div class="brief-line"><strong>Looking for</strong>${d.idealType.relationshipType}</div>
          <div class="brief-line"><strong>Love language</strong>${d.idealType.loveLanguage}</div>
          ${d.idealType.dealbreakers.map(x => `<div class="brief-line"><strong>Dealbreaker</strong>${x}</div>`).join("")}
        </div>`;
    }
    if (vis.isVisible("values")) {
      cols += `
        <div class="brief-block">
          <h3>His Values</h3>
          ${d.values.map(v => `<div class="brief-line"><strong>${v.label}</strong>${v.text}</div>`).join("")}
        </div>`;
    }
    rooms.push({
      id: "room-brief",
      label: "Ideal Type & Values",
      body: `${brief}<div class="brief-cols">${cols}</div>`,
    });
  }

  // ---- Room: Friends & FAQ ----
  if ((vis.isVisible("friends") && d.friendReviews.length) || (vis.isVisible("faq") && d.faq.length)) {
    let body = "";
    if (vis.isVisible("friends") && d.friendReviews.length) {
      body += `<div class="postcards">${d.friendReviews.map(r => `
        <div class="postcard">
          <p>"${r.quote}"</p>
          <div class="from">${r.name}, ${r.relation}</div>
        </div>`).join("")}</div>`;
    }
    if (vis.isVisible("faq") && d.faq.length) {
      body += `<div class="guide">${d.faq.map(item => `
        <div class="guide-item">
          <div class="q">${item.q}</div>
          <div class="a">${item.a}</div>
        </div>`).join("")}</div>`;
    }
    rooms.push({
      id: "room-correspondence",
      label: "Friends & FAQ",
      body,
    });
  }

  // ---- Room: Contact (always shown) ----
  const ledgerRows = [
    d.contact.email ? `<div class="ledger-line"><span>Email</span><span>${d.contact.email}</span></div>` : "",
    d.contact.phone ? `<div class="ledger-line"><span>Phone</span><span>${d.contact.phone}</span></div>` : "",
    vis.isVisible("schedulingEnabled") && d.contact.schedulingLink
      ? `<div class="ledger-line"><span>Schedule</span><a href="${d.contact.schedulingLink}" target="_blank">Book a time →</a></div>`
      : "",
  ].join("");
  rooms.push({
    id: "room-visitors",
    label: "Contact",
    body: `
      ${ledgerRows ? `<div class="ledger">${ledgerRows}</div>` : ""}
      <p class="ledger-note"><strong>${d.contact.note}</strong></p>
    `,
  });

  // ---- render ----
  const container = document.getElementById("roomsContainer");
  container.innerHTML = rooms.slice(1).map((r, i) => `
    <section class="room" id="${r.id}">
      <div class="room-inner">
        <div class="room-kicker">Room ${romanize(i + 1)}</div>
        <h2 class="room-title">${r.label}</h2>
        ${r.body}
      </div>
    </section>
  `).join("");

  initGalleryChrome(rooms);
</script>
</body>
</html>
