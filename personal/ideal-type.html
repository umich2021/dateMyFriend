<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Type — Victor Ng</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="progress"></div>

<nav id="nav">
  <a class="brand" href="index.html">VICTOR NG</a>
  <ul class="navlinks" id="navlinks"></ul>
</nav>

<section class="page-hero reveal">
  <h1>Ideal type.</h1>
  <p>What he's actually looking for, not just who's easiest to talk to.</p>
</section>

<section id="idealContent"></section>

<footer class="sitefoot"><a href="index.html">← Back home</a></footer>

<script src="../data/victor-data.js"></script>
<script src="assets/app.js"></script>
<script>
  renderNav("ideal-type.html");
  const mount = document.getElementById("idealContent");
  if (!window.VictorDB.isVisible("idealType")) {
    mount.innerHTML = renderHiddenState("Ideal Type");
  } else {
    const d = window.VictorDB.data;
    mount.innerHTML = `
      <div class="char-select reveal">
        <div class="char-select-bar">CHARACTER SELECT</div>
        <div class="char-select-body">
          <div class="char-portrait">
            <div class="char-figure">
              <div class="char-head"><span>?</span></div>
              <div class="char-body"></div>
            </div>
          </div>
          <div class="char-info">
            <div class="char-name">PLAYER 2 <span class="char-cursor">_</span></div>
            <div class="char-status">Not yet unlocked</div>
            <div class="char-stats">
              ${d.idealType.tags.map(t => `<div class="char-stat"><span>${t}</span><span class="stars">★★★★★</span></div>`).join("")}
            </div>
          </div>
        </div>
      </div>
      <div class="ideal-block reveal">
        <p class="quote">"${d.idealType.summary}"</p>
        <div class="ideal-tags">${d.idealType.tags.map(t => `<span>${t}</span>`).join("")}</div>
        <div class="ideal-note">${d.idealType.note}</div>
        <div class="ideal-meta">
          <div><strong>Looking for</strong><span>${d.idealType.relationshipType}</span></div>
          <div><strong>Love language</strong><span>${d.idealType.loveLanguage}</span></div>
        </div>
      </div>
      <div class="label" style="margin-top:50px;">Dealbreakers</div>
      <div class="flag-grid">
        ${d.idealType.dealbreakers.map(f => `
          <div class="flag-cell red reveal">
            <span class="mark">−</span>
            <p>${f}</p>
          </div>`).join("")}
      </div>`;
  }
  initChrome();
</script>
</body>
</html>
